spring:
  datasource:
    url: jdbc:h2:mem:ops;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=1000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6399
